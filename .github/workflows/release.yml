name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Homebrew formula
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          archive_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${VERSION}.tar.gz"
          curl --fail --location --retry 5 --output source.tar.gz "$archive_url"
          sha256="$(sha256sum source.tar.gz | cut -d ' ' -f 1)"

          sed -i -E "s#  url \".*\"#  url \"${archive_url}\"#" Formula/cursor-resize-window.rb
          sed -i -E "s#  sha256 \".*\"#  sha256 \"${sha256}\"#" Formula/cursor-resize-window.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cursor-resize-window.rb
          git commit -m "build: update formula to ${VERSION}"
          git push origin HEAD:main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
